<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="512" height="512" role="img" aria-label="Logo GrowSync">
  <title>GrowSync</title>
  <!-- ===== MARK GROWSYNC: daun dua arah (ubah warna di atribut fill/stroke pada grup ini) ===== -->
  <g id="mark" fill="#FFFFFF" stroke="#FFFFFF">
    <!-- Daun di tengah: scale 0.62 = ukuran daun; tulang daun adalah lubang (subpath kedua, fill-rule evenodd) -->
    <g id="daun" transform="translate(12 12) scale(0.62) translate(-12 -12)" stroke="none">
      <path fill-rule="evenodd" d="M12 3C18 6 19.5 13 12 21C4.5 13 6 6 12 3Z M11.35 8a.65.65 0 0 1 1.3 0V18a.65.65 0 0 1-1.3 0Z"/>
    </g>
    <!-- Gelombang sinyal ke dua arah (kirim dan terima), tebal garis = stroke-width -->
    <g id="gelombang" fill="none" stroke-width="1.15" stroke-linecap="round">
      <path d="M16.57 8.43A5.8 5.8 0 0 1 16.57 15.57"/>
      <path d="M7.43 8.43A5.8 5.8 0 0 0 7.43 15.57"/>
      <path d="M18.23 7.14A7.9 7.9 0 0 1 18.23 16.86"/>
      <path d="M5.77 7.14A7.9 7.9 0 0 0 5.77 16.86"/>
      <path d="M19.88 5.84A10 10 0 0 1 19.88 18.16"/>
      <path d="M4.12 5.84A10 10 0 0 0 4.12 18.16"/>
    </g>
  </g>
</svg>
